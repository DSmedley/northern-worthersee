[settings]
experimental = true

[tools]
hugo = "0.158.0"
go = "1.26.3"
node = "26.2.0"
markdownlint-cli2 = "0.22.1"
"npm:cspell" = "10.0.0"
git-lfs = "3.7.1"
taplo = "0.10.0"
lefthook = "1.11.13"
lychee = "0.18.1"

[tasks.setup]
description = "Install npm dependencies, Playwright browsers, and git hooks"
run = [
  "npm install",
  "npm run install:browsers",
  "lefthook install",
]

[tasks.optimize-gallery]
description = "Resize & re-encode gallery images to WebP in place (replacing the originals), detect duplicates, and write a report. Pass file paths to optimize a subset; with no args it processes the entire gallery."
run = "node scripts/optimize-gallery.mjs"

[tasks.check]
description = "Run all validations (markdown, spelling, TOML)"
run = [
  "markdownlint-cli2 'content/**/*.md'",
  "cspell --no-progress",
  "taplo check 'config/**/*.toml' mise.toml",
]

[tasks.lint-links]
description = "Check for broken links in the built site"
run = "lychee --offline public/"

[tasks.check-links]
description = "Build the site and check for broken links"
run = [
  "hugo --minify --baseURL '/'",
  "mise run lint-links",
]

[tasks.check-a11y]
description = "Check accessibility across all pages using pa11y-ci"
run = """
#!/usr/bin/env bash
set -euo pipefail
CHROME=$(find ~/.cache/ms-playwright -name "chrome" -type f 2>/dev/null | head -1)
if [ -z "$CHROME" ]; then
  echo "ERROR: Playwright browsers not installed. Run: npm run install:browsers" >&2
  exit 1
fi
export PUPPETEER_EXECUTABLE_PATH="$CHROME"
hugo server --port 1314 --disableFastRender > /dev/null 2>&1 &
SERVER_PID=$!
trap 'kill $SERVER_PID 2>/dev/null' EXIT
until curl -sf http://localhost:1314 > /dev/null; do sleep 0.5; done
npx pa11y-ci --sitemap http://localhost:1314/sitemap.xml
"""

[tasks.check-lighthouse]
description = "Run Lighthouse checks across all pages using Unlighthouse"
run = """
#!/usr/bin/env bash
set -euo pipefail
CHROME=$(find ~/.cache/ms-playwright -name "chrome" -type f 2>/dev/null | head -1)
if [ -z "$CHROME" ]; then
  echo "ERROR: Playwright browsers not installed. Run: npm run install:browsers" >&2
  exit 1
fi
export PUPPETEER_EXECUTABLE_PATH="$CHROME"
hugo server --port 1314 --disableFastRender > /dev/null 2>&1 &
SERVER_PID=$!
trap 'kill $SERVER_PID 2>/dev/null' EXIT
until curl -sf http://localhost:1314 > /dev/null; do sleep 0.5; done
npx unlighthouse-ci --site http://localhost:1314 --disable-robots-txt
"""

[hooks]
postinstall = ["echo 'Running mise setup'", { task = "setup" }]
