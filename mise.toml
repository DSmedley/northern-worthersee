[settings]
experimental = true

[tools]
hugo = "0.158.0"
go = "1.26.3"
node = "26.2.0"
markdownlint-cli2 = "0.22.1"
"npm:cspell" = "10.0.0"
git-lfs = "3.7.1"
taplo = "0.10.0"
lefthook = "1.11.13"
lychee = "0.18.1"

[tasks.sync]
description = "Ensure this machine has everything needed to work on the repo"
depends = ["sync:*"]

[tasks.check]
description = "Run all validations (markdown, spelling, TOML)"
depends = ["check:markdown", "check:spelling", "check:toml"]

[hooks]
enter = [{ task = "sync" }]
