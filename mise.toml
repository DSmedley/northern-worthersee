[tools]
hugo = "0.158.0"
go = "1.26.3"
node = "26.2.0"
markdownlint-cli2 = "0.22.1"
"npm:cspell" = "10.0.0"
git-lfs = "3.7.1"
taplo = "0.10.0"
lefthook = "1.11.13"
lychee = "0.18.1"

[tasks.setup]
description = "Install git hooks via lefthook"
run = "lefthook install"

[tasks.check]
description = "Run all validations (markdown, spelling, TOML)"
run = [
  "markdownlint-cli2 'content/**/*.md'",
  "cspell --no-progress 'content/**/*.md'",
  "taplo check 'config/**/*.toml' mise.toml",
]

[tasks.check-links]
description = "Build the site and check for broken links"
run = [
  "hugo --minify",
  "lychee --offline public/",
]

[shell_alias]
g = "git"
gs = "git status"
gst = "git status"
gss = "git status --short"
ga = "git add"
gaa = "git add --all"
gap = "git add --patch"
gau = "git add --update"
gc = "git commit"
gcv = "git commit --verbose"
gca = "git commit --all"
gcm = "git commit --amend"
gcmh = "git commit --amend --no-edit"
gch = "git commit --no-edit"
gco = "git checkout"
gcb = "git checkout -b"
gsw = "git switch"
grt = "git restore"
gd = "git diff"
gdnw = "git diff --ignore-all-space"
gdc = "git diff --cached"
gdw = "git diff --word-diff"
gdf = "git diff --name-only"
gdt = "git difftool"
gmt = "git mergetool"
gl = "git log"
gla = "git log --all"
glst = "git log --stat"
glg = "git log --graph --oneline --decorate --all"
gsh = "git show"
gsm = "git show --stat"
gwc = "git whatchanged"
gb = "git branch"
gba = "git branch --all"
gbm = "git branch --move"
gbd = "git branch --delete"
gbD = "git branch -D"
gr = "git remote"
gcl = "git clone"
gf = "git fetch"
gfa = "git fetch --all"
gfr = "git pull --rebase"
gpl = "git pull"
gplr = "git pull --rebase"
gps = "git push"
gpsf = "git push --force-with-lease"
gpls = "git pull && git push"
grb = "git rebase"
grbi = "git rebase --interactive"
grbc = "git rebase --continue"
grba = "git rebase --abort"
grs = "git reset"
grsh = "git reset --hard"
grsl = "git reset HEAD~1"
gm = "git merge"
gmnff = "git merge --no-ff"
gmff = "git merge --ff-only"
gash = "git stash"
gasha = "git stash apply"
gashp = "git stash pop"
gashl = "git stash list"
gcp = "git cherry-pick"
gt = "git tag"
gsu = "git submodule update"
gsur = "git submodule update --recursive --remote"
grm = "git rm"
gbl = "git blame"
gapp = "git apply"
gtop = "git rev-parse --show-toplevel"
gpr = "gh pr create"