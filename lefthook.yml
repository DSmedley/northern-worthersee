pre-commit:
  commands:
    check:
      run: mise run check
      skip:
        - merge
        - rebase
    check-links:
      run: mise run check-links
      skip:
        - merge
        - rebase
    optimize-gallery:
      glob: "assets/gallery/**/*.{jpg,jpeg,png,gif,webp,avif,tif,tiff}"
      run: mise run optimize-gallery {staged_files} && git add assets/gallery
      skip:
        - merge
        - rebase
