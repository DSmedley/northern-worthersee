{{ $schedule := hugo.Data.event.schedule }}
<ol class="border-s-2 border-primary-500 dark:border-primary-300 list-none">
  {{ range $schedule }}
  <li>
    <div class="flex">
      <div class="bg-primary-500 dark:bg-primary-300 text-neutral-50 dark:text-neutral-700 min-w-[30px] h-8 text-2xl flex items-center justify-center rounded-full ltr:-ml-12 rtl:-mr-[79px] mt-5">
        {{ partial "icon" .icon }}
      </div>
      <div class="block p-6 rounded-lg shadow-2xl flex-1 ms-6 mb-10 break-words">
        <div class="flex justify-between">
          <h2 class="mt-0">{{ .header }}</h2>
        </div>
        <h4 class="mt-0">{{ .start }}{{ if .stop }} – {{ .stop }}{{ end }}</h4>
        <div class="mb-6">{{ .description }}</div>
      </div>
    </div>
  </li>
  {{ end }}
</ol>
