{{ $src := .Get "src" }}
{{ $thumb := .Get "thumb" | default $src }}
{{ $alt := .Get "alt" | default "" }}
{{ $w := .Get "width" }}
{{ $h := .Get "height" }}

<a href="{{ $src }}" {{ with $w }}data-pswp-width="{{ . }}" {{ end }} {{ with $h }}data-pswp-height="{{ . }}" {{ end }}
  target="_blank">
  <img src="{{ $thumb }}" alt="{{ $alt }}" class="pswp-thumbnail w-auto object-cover cursor-pointer rounded-md"
    loading="lazy">
</a>
