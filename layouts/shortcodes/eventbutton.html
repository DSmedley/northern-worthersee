{{ $eventDate := partial "event-date" . }}
{{ $eventDate = $eventDate.Format "2006" }}
<a
  class="!rounded-md bg-transparent px-4 py-2 !text-neutral !no-underline hover:!bg-primary-500 hover:!bg-opacity-75 border"
  href="{{ hugo.Data.event.registrationUrl }}"
  target="_blank"
  rel="noopener noreferrer"
  role="button">
  {{ $eventDate }} Event Details
</a>
