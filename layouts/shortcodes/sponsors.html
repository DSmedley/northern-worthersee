<div class="grid sponsors-grid gap-4 mt-6 mb-6">

  {{ range hugo.Data.sponsors }}
  {{ $image := resources.Get (printf "sponsors/%s" .image) }}

  {{ if .link }}
  <a href="{{ .link }}" target="_blank" rel="noopener noreferrer"
    class="flex items-center justify-center p-5 sponsor-card border border-solid rounded-lg no-underline">
    {{ else }}
    <div
      class="flex items-center justify-center p-5 sponsor-card border border-solid rounded-lg no-underline">
      {{ end }}

      {{ if $image }}
      <img src="{{ $image.RelPermalink }}" alt="{{ .name }}" class="not-prose max-w-full h-auto">
      {{ else }}
      <span class="font-semibold ">{{ .name }}</span>
      {{ end }}

      {{ if .link }}
  </a>
  {{ else }}
</div>
{{ end }}
{{ end }}

</div>
